<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ site.name }}{% if site.title %} · {{ site.title }}{% endif %}</title>
  <meta name="description" content="{{ site.tagline }}">

  <!-- Preview card when your link is shared on LinkedIn, Slack, iMessage, etc. -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="{{ site.name }}{% if site.title %} · {{ site.title }}{% endif %}">
  <meta property="og:description" content="{{ site.tagline }}">

  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%236d3fc7'/><text x='50%25' y='54%25' text-anchor='middle' dominant-baseline='middle' font-family='Georgia,serif' font-size='30' fill='%23faf7f2'>{{ initials }}</text></svg>">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  {% block head %}{% endblock %}

  <script>
    // Apply saved theme before paint to avoid a flash
    try {
      var t = localStorage.getItem("theme");
      if (t) document.documentElement.setAttribute("data-theme", t);
    } catch (e) {}
    document.documentElement.classList.add("js");
  </script>
</head>
<body>
  {% block content %}{% endblock %}

  <script src="{{ url_for('static', filename='main.js') }}" defer></script>
</body>
</html>
